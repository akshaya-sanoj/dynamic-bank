<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VAULTLINE - Dashboard</title>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Flowbite -->
    <link href="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/flowbite@4.0.1/dist/flowbite.min.js"></script>
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-gray-900 text-white min-h-screen">
    <!-- Navigation Bar -->
    <nav class="bg-emerald-950 border-b border-gray-800 px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <img class="w-8 h-8" src="./watermarked_img_10565261629110271654-removebg-preview.png" alt="logo" />
        <span class="text-2xl font-bold text-[#D4AF37]">VAULTLINE</span>
      </div>
      <div class="flex items-center space-x-4">
        <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg text-sm transition">
          <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
        </button>
      </div>
    </nav>

   <h1 id="head1" class="text-center text-5xl capitalize my-10 font-bold"></h1>
      <!-- Action Cards (Deposit & Withdraw) -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Deposit Form -->
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-lg space-y-4">
          <h3 class="text-lg font-bold text-emerald-400 flex items-center">
            <i class="fa-solid fa-arrow-down-left mr-2"></i> Deposit Money
          </h3>
          <div>
            <label class="block text-sm font-medium mb-1">Account Number</label>
            <input type="number" id="depo_acnum" placeholder="Account Number" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Amount (₹)</label>
            <input type="number" id="depo" placeholder="Enter amount" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Password</label>
            <input type="password" id="depo_password" placeholder="••••••••" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white" />
          </div>
          <button onclick="deposit()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg transition">
            Deposit
          </button>
          <div id="bal" class="hidden p-3 bg-emerald-900/50 border border-emerald-500/50 rounded-lg text-sm text-emerald-200"></div>
        </div>

        <!-- Withdraw Form -->
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-lg space-y-4">
          <h3 class="text-lg font-bold text-red-400 flex items-center">
            <i class="fa-solid fa-arrow-up-right mr-2"></i> Withdraw Money
          </h3>
          <div>
            <label class="block text-sm font-medium mb-1">Account Number</label>
            <input type="number" id="with_acnum" placeholder="Account Number" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Amount (₹)</label>
            <input type="number" id="with_amt" placeholder="Enter amount" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white" />
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Password</label>
            <input type="password" id="with_pass" placeholder="••••••••" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white" />
          </div>
          <button onclick="withdraw()" class="w-full bg-red-600 hover:bg-red-700 text-white font-medium py-2.5 rounded-lg transition">
            Withdraw
          </button>
          <div id="bal1" class="hidden p-3 bg-red-900/50 border border-red-500/50 rounded-lg text-sm text-red-200"></div>
        </div>
      </div>

      <!-- Transaction History Table -->
      <section class="my-20">
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-lg">
        <h3 class="text-lg font-bold text-[#D4AF37] mb-4">Transaction History</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left text-gray-300">
            <thead class="text-xs uppercase bg-gray-700 text-gray-400">
              <tr>
                <th scope="col" class="px-4 py-3">Type</th>
                <th scope="col" class="px-4 py-3">Amount</th>
                <th scope="col" class="px-4 py-3">Date & Time</th>
                <th scope="col" class="px-4 py-3">Balance After</th>
              </tr>
            </thead>
            <tbody id="txHistoryTable">
              <tr>
                <td colspan="4" class="px-4 py-4 text-center text-gray-500">No transactions recorded yet.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      </section>
    </div>



 <script src="./script.js"></script>
    <script>
      const user = localStorage.getItem("usrname");

      if (!user) {
        window.location.href = "./login.html";
      } else {
        document.getElementById("head1").innerHTML = `Welcome ${user}`;
      }
    </script>

  </body>
</html>
